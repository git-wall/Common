x-common: &common
  # cam ghi du lieu len o dia cua host / prevent writing data to host disk / neu la service thi nen bat
  read_only: false
  # file tạm nếu cần ghi sau khi đã set read_only: true thường đi chung
  #    tmpfs:
  #      - /tmp
  # chặn syscall nguy hiểm / block dangerous syscalls / doi voi service khong can giu lai gi ca drop all
  cap_drop:
    - ALL
    #    cap_add:
    # neu can truy cap truc tiep vao port 80 thi moi can cap_add NET_BIND_SERVICE, neu khong thi khong can
    #      - NET_BIND_SERVICE
    # thao tac network
  #      - NET_RAW
  # ngan truy cap tang cuong / enhance access control
  security_opt:
    - no-new-privileges:true
  restart: &restart always

services:
  nexus:
    image: sonatype/nexus3
    container_name: nexus
    <<: *common
    user: "1000:1000"
    mem_limit: 1536m
    cpus: 1.5
    ports:
      - "8081:8081"
    networks:
      - nexus-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/actuator/health" ]
      interval: 30s
      timeout: 5s
      retries: 2
      start_period: 30s
    restart: *restart

networks:
  nexus-network:
    # cam truy cap ben ngoai / not accessible from outside
    #    internal: true
    driver: bridge