plugins {
  id 'java-library' // import to use 'api' in dependencies
  id 'java'
  id 'org.springframework.boot' version '2.7.18'
  id 'io.spring.dependency-management' version '1.1.6'
  //------------------------------------------------
  id 'me.champeau.jmh' version '0.7.2'
  id 'jacoco'
  id 'maven-publish'
  id 'io.gatling.gradle' version '3.10.5'
  id "org.openapi.generator" version "7.8.0" // OpenAPI Generator
// use this then ./gradlew jib (push to registry) gradle -> image
  id 'com.google.cloud.tools.jib' version '3.4.0'
}

apply(from: "./gradle/profile-config.gradle")

group = 'org.app.common'
version = '2.0.0'

java.toolchain.languageVersion = JavaLanguageVersion.of(11)
jacoco.toolVersion = "0.8.10"

jar {
  enabled = true
  archiveFileName = "${group}${version}.jar"
}

// use when in spring project
bootJar {
  enabled = true
  layered {}
}

