}

// alibaba cloud
dependencies {
  // 1. nacos-discovery better than eureka | nacos is a service discovery and configuration management platform
//  api 'com.alibaba.cloud:spring-cloud-starter-alibaba-nacos-discovery'
  // 2. nacos config better than spring config by manager all in 1 place is (NACOS SERVER)
//  api 'com.alibaba.cloud:spring-cloud-starter-alibaba-nacos-config'
}

// ===================================================================
// Import to dependency
// ===================================================================
dependencyManagement {
  imports {
    mavenBom "org.springframework.cloud:spring-cloud-dependencies:2021.0.3"
//    mavenBom "com.alibaba.cloud:spring-cloud-alibaba-dependencies:2021.0.4.0"
  }
}

openApiGenerate {
  generatorName.set("gatling")
  inputSpec.set("http://localhost:8080/v3/api-docs.yaml")
  outputDir.set("$buildDir/generated/gatling")
  apiPackage.set("org.app.common.controller")
}

// skip duplicate files in folder resource when build jar
processResources {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Trong file .gradle (Groovy)
afterEvaluate {
  apply from: "./gradle/publishing.gradle.kts"
}
