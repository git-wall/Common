# casdoor for casbin (in memory rules)
version: '3.8'
services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: casdoor
    ports:
      - "3306:3306"
  
  redis:
    image: redis:6.0-alpine
    restart: always
    ports:
      - "6379:6379"

# Username: admin
# Password: 123
  casdoor:
    image: casbin/casdoor-all-in-one
    restart: always
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    environment:
      - driverName=mysql
      - dataSourceName=root:root_password@tcp(db:3306)/
      - origin=http://localhost:8000
      - redisEndpoint=redis:6379
      - isEnableWatcher=true