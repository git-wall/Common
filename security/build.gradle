plugins {
  id 'org.springframework.boot' version '2.7.18'
  id 'io.spring.dependency-management' version '1.1.6'
}

group = 'security'
version = '2.0.0'

dependencies {
  implementation project(":web")
  implementation project(":observation")
  implementation project(":message")
  implementation project(":aop")
  implementation project(":network")

  implementation(authLibs.bundles.goodle.auth)
  implementation(authLibs.bundles.jwt)

  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'org.springframework.boot:spring-boot-starter-security'
  implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
  implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'


  implementation("org.casbin:jdbc-adapter:2.13.0")
  implementation("org.casbin:jcasbin-redis-watcher:1.9.0")
  implementation("org.casbin:jcasbin:1.99.0")
  implementation("org.casbin:casdoor-spring-boot-starter:1.15.0")
  implementation("org.casbin:casdoor-java-sdk:1.42.0")
}
