[versions]
slf4j = "2.0.12"
logback = "1.5.6"
logstash = "7.4"

[libraries]
slf4j-api = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j" }
logback-classic = { group = "ch.qos.logback", name = "logback-classic", version.ref = "logback" }
logstash-encoder = { group = "net.logstash.logback", name = "logstash-logback-encoder", version.ref = "logstash" }

[bundles]
logging = ["slf4j-api", "logback-classic", "logstash-encoder"]